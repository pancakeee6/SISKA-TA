services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siska_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siska_password}
      POSTGRES_DB: ${POSTGRES_DB:-siska_db}
    volumes:
      - /opt/siska/postgres_data:/var/lib/postgresql/data
    networks:
      front-tier:
        aliases:
          - db
          - siska-db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure

  backend:
    image: mizzcode/siska-backend:1.0.6
    env_file: ./.env
    environment:
      UPLOAD_DIR: /app/uploads
    volumes:
      - /opt/siska/uploads:/app/uploads
    networks:
      front-tier:
        aliases:
          - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure

  frontend:
    image: mizzcode/siska-frontend:1.0.1
    networks:
      - front-tier
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure

networks:
  front-tier:
    external: true
